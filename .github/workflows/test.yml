name: Tests

# Tests run only when the script or the tests change.
on:
  pull_request:
    paths:
      - docker-squash.sh
      - tests/**
  push:
    branches: [main]
    paths:
      - docker-squash.sh
      - tests/**

permissions:
  contents: read

jobs:
  test:
    # Tests run on arm64, the platform the expected outputs were created on.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: sh tests/test.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/logs/
